<h2 mat-dialog-title>{{ modalTitle | translate }}</h2>
<form [formGroup]="settingsForm" (ngSubmit)="onSubmit(settingsForm.value)">
  <mat-dialog-content>
    <div formArrayName="column_names">
      <div>
        <div *ngFor="let field of column_names.controls; let i=index" [formGroupName]="i">
          <mat-form-field>
            <mat-checkbox class="margin-y" matPrefix formControlName="selected" id="field-{{i}}" name="field-{{i}}">
            </mat-checkbox>
            <input matInput [placeholder]="checkbox_name" formControlName="checkbox_name" id="input-{{i}}" />
          </mat-form-field>
        </div>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-raised-button color="primary" [disabled]="!settingsForm.valid" type="submit" mat-dialog-close
      (click)="save()">Submit</button>
    <button mat-raised-button color="primary" [disabled]="!settingsForm.valid" type="button"
      [mat-dialog-close]="true">Cancel</button>
  </mat-dialog-actions>
</form>
