<form [formGroup]="dailogform">
  <!-- <h1 mat-dialog-title>
    Confirm Action
  </h1> -->
  <div mat-dialog-content [ngStyle]="{'text-align': 'center'}">
    <p class="msg">{{message}} </p>
  </div>

  <div [ngStyle]="{'margin-top': '5px'}">
    <div fxLayout="row wrap" fxLayoutAlign="space-evenly" [ngStyle]="{'margin-top': '5px'}">
      <div fxLayout="row" fxLayoutAlign="center" *ngIf="dialogType=='CONFIRM'">
        <mat-dialog-actions>
          <button mat-raised-button color="primary" type="submit" mat-dialog-close>YES</button>
          <button mat-raised-button color="primary" type="button" [mat-dialog-close]="true">NO</button>
        </mat-dialog-actions>
      </div>
      <div fxLayout="row" fxLayoutAlign="center" *ngIf="dialogType=='ERROR'">
        <mat-dialog-actions>
          <button mat-raised-button color="primary" type="button" [mat-dialog-close]="true">OK</button>
        </mat-dialog-actions>
      </div>
    </div>
  </div>

</form>
