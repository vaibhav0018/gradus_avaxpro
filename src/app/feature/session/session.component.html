<mat-sidenav-container>
    <mat-sidenav *ngIf="settings.menu == 'vertical'" [opened]="settings.sidenavIsOpened"
      [mode]="sidemenu_mode" #sidenav class="sidenav mat-elevation-z6">
      <app-sidenav></app-sidenav>
    </mat-sidenav>
    <!-- <mat-sidenav-content id="main" perfectScrollbar [disabled]="settings.fixedHeader" (psScrollY)="onPsScrollY($event)">  -->
      <mat-sidenav-content id="main" > 
      <!-- <mat-sidenav-content id="main" > -->
      <mat-toolbar color="primary" class="flex-p-x custom-menu">
        <div fxLayout="row" fxLayoutAlign="space-between center" class="w-100">
          <div fxLayout="row" fxLayoutAlign="center center">
            <button *ngIf="settings.menu == 'vertical'" mat-icon-button (click)="toggleSidenav()">
              <mat-icon>menu</mat-icon>
            </button>
            <a *ngIf="settings.menu == 'horizontal'" mat-raised-button color="accent"
              (click)="funcVoid()" class="small-logo">aP</a>
            <a *ngIf="settings.menu == 'horizontal'" class="logo"  (click)="funcVoid()">avaxPRO</a>
            <form [formGroup]="form">
              <!-- <mat-select formControlName="cmbMenu" style="width: 100px !important;" class="font1em"
                [(ngModel)]="selectedMenu" (selectionChange)="openPage()"> -->
                <mat-select formControlName="cmbMenu" style="width: 100px !important;" class="font1em"
                [(ngModel)]="selectedMenu" >
                <mat-option value='1' (click)="openPage()">Recently visited</mat-option>
                <mat-option value='2' (click)="openPage()">Favourites</mat-option>
                <mat-option value='3' (click)="openPage()">All Services</mat-option>
                <mat-option value='4' (click)="openPage()">Dashboard</mat-option>
                <mat-option value='5' (click)="openPage()">Party Query</mat-option>
                <mat-option value='6' (click)="openPage()">Stock Query</mat-option>
                <mat-option value='7' (click)="openPage()">Item Query</mat-option>
                <mat-option value='8' (click)="openPage()">Stoppage Clearance</mat-option>
                <mat-option value='9' (click)="openPage()">User Information</mat-option>
              </mat-select>
            </form>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class='font1em'>{{userName}}</span>
          </div>
  
          <div fxLayout="row" class="font1em mat-body">
              
          </div>
  
          <div fxLayout="row" fxLayoutAlign="end center">
            <span class="font1em">{{loggedInBranch}}</span>&nbsp;&nbsp;&nbsp;
            <span class="font1em">{{loggedInYear}}</span>
            <app-fullscreen></app-fullscreen>
            <app-user-menu></app-user-menu>
          </div>
        </div>
      </mat-toolbar>
  
      <!-- <mat-toolbar color="primary" *ngIf="settings.menu == 'horizontal'" class="horizontal-menu flex-p-x transition-2"
        [class.sticky]="isStickyMenu" [class.fixed-top]="!settings.fixedHeader">
        <div fxLayout="row" fxLayoutAlign="center center" class="w-100">
          <app-horizontal-menu [menuParentId]="0"></app-horizontal-menu>
        </div>
      </mat-toolbar> -->
  
      <div id="main-content" #divMain class="inner-sidenav-content transition-2" 
        [class.horizontal-menu-hidden]="isStickyMenu" >
        <app-breadcrumb></app-breadcrumb>
        <router-outlet></router-outlet>
      </div> 
      <div #backToTop fxLayout="row" fxLayoutAlign="center center" class="back-to-top" (click)="scrollToTop()">
        <mat-icon>arrow_upward</mat-icon>
      </div>
      <div #backToBottom fxLayout="row" fxLayoutAlign="center center" class="back-to-bottom" (click)="scrollToBottom()">
        <mat-icon>arrow_downward</mat-icon>
      </div>
    </mat-sidenav-content>
  
  </mat-sidenav-container>
