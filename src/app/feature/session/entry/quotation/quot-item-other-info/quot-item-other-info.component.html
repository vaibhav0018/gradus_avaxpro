<mat-dialog-content>
    <form [formGroup]="formItemOtherInfo" *ngIf="formItemOtherInfo">
    <table class='html-table' border="0">
      <tr>
        <td colspan="2"> ITEM OTHER INFO </td>
      </tr>
      <tr>
        <td>PARTY ITEM :</td>
        <td>
            <mat-form-field class="wp-150">
                <input matInput type="text" value="" formControlName="txtPartyItemCode" />
            </mat-form-field>
        </td>
      </tr>
      <tr>
        <td>NOTE :</td>
        <td>
            <mat-form-field class="wp-150">
                <input matInput type="text" value="" formControlName="txtItemNote" />
            </mat-form-field>
        </td>
      </tr>
      <tr>
        <td>REMARKS :</td>
        <td>
            <mat-form-field class="wp-150">
                <input matInput type="text" value="" formControlName="txtItemRemarks" />
            </mat-form-field>
        </td>
      </tr>

      </tr>
      <tr>

            <mat-form-field class="wp-50">

      <tr>

        <td>
            <mat-form-field class="wp-150">
                <mat-select placeholder="TOLERANCE" formControlName="cmbTolerance"  >
                    <!-- tableData -->
                    <mat-option *ngFor="let obj of tableData" [value]="obj.var_code">
                        {{obj.var_desc}}
                      </mat-option>
                  
                </mat-select>
              </mat-form-field>
        </td>

        <td>
            <mat-form-field class="wp-50">
                <input matInput type="text" value="" formControlName="txtToleranceLength" />

      </tr>
